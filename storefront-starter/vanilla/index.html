<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storefront — Headless Starter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8f9fc; color: #18181b; }

    .header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 50; }
    .header__name { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #7c3aed, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header__search { flex: 1; max-width: 400px; margin: 0 auto; }
    .header__search input { width: 100%; padding: 10px 16px; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .header__search input:focus { border-color: #7c3aed; }

    .section { padding: 32px 24px; }
    .section__title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .product-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; transition: all 0.3s; cursor: pointer; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
    .product-card img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .product-card__info { padding: 12px 14px; }
    .product-card__name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .product-card__price { font-size: 16px; font-weight: 700; color: #7c3aed; }
    .product-card__old-price { text-decoration: line-through; color: #9ca3af; font-size: 12px; margin-left: 8px; }

    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
    .cat-btn { padding: 10px 18px; border-radius: 12px; border: 1px solid #e5e7eb; background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .cat-btn:hover { border-color: #7c3aed; color: #7c3aed; }

    .footer { text-align: center; padding: 32px; font-size: 12px; color: #9ca3af; border-top: 1px solid #e5e7eb; margin-top: 40px; }

    .loading { display: flex; align-items: center; justify-content: center; min-height: 40vh; font-size: 16px; color: #9ca3af; }

    @media (max-width: 768px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .section { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <span class="header__name" id="store-name">Shop</span>
    <div class="header__search">
      <input type="text" id="search-input" placeholder="Tìm sản phẩm..." />
    </div>
  </header>

  <main id="app">
    <div class="loading">Đang tải...</div>
  </main>

  <footer class="footer" id="footer">
    <p></p>
  </footer>

  <script type="module">
    // ══════════════════════════════════════════════════════════════
    // CONFIGURATION — Change this to your store's API URL
    // ══════════════════════════════════════════════════════════════
    const API_BASE = 'https://fashionvn.com/api/storefront'
    // If running locally: 'http://fashionvn.localhost/api/storefront'

    // ── API Helper ──
    async function api(path) {
      const res = await fetch(`${API_BASE}${path}`, { headers: { 'Accept': 'application/json' } })
      const json = await res.json()
      return (json && typeof json === 'object' && 'data' in json && json.type) ? json.data : json
    }

    // ── Render Helpers ──
    function formatPrice(v) { return Number(v || 0).toLocaleString('vi-VN') + 'đ' }

    function renderProducts(products, title = 'Sản phẩm') {
      if (!products.length) return ''
      return `
        <section class="section">
          <h2 class="section__title">${title}</h2>
          <div class="product-grid">
            ${products.map(p => `
              <div class="product-card" onclick="window.location.hash='product/${p.id}'">
                <img src="${p.image_url || p.image || ''}" alt="${p.name}" onerror="this.style.display='none'" />
                <div class="product-card__info">
                  <div class="product-card__name">${p.name}</div>
                  <span class="product-card__price">${formatPrice(p.promotion_price || p.price)}</span>
                  ${p.promotion_price && p.promotion_price < p.price ? `<span class="product-card__old-price">${formatPrice(p.price)}</span>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `
    }

    function renderCategories(categories) {
      if (!categories.length) return ''
      return `
        <section class="section">
          <h2 class="section__title">Danh mục</h2>
          <div class="categories">
            ${categories.map(c => `<button class="cat-btn">${c.name}</button>`).join('')}
          </div>
        </section>
      `
    }

    // ── Bootstrap ──
    async function init() {
      try {
        // Single API call gets everything
        const config = await api('/site-config')
        document.getElementById('store-name').textContent = config.store?.shop_name || 'Shop'
        document.title = config.store?.shop_name || 'Shop'

        // Fetch section data
        const [banners, products, pages] = await Promise.all([
          api('/banners').catch(() => []),
          api('/products?per_page=12').catch(() => []),
          api('/pages').catch(() => []),
        ])

        const productList = Array.isArray(products) ? products : (products?.data || [])
        const categories = config.categories || []

        // Render
        let html = ''
        const sections = (config.layout?.sections || []).filter(s => s.enabled !== false).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))

        for (const section of sections) {
          switch (section.type) {
            case 'categories': html += renderCategories(categories); break
            case 'featured_products':
            case 'new_arrivals':
              html += renderProducts(productList, section.params?.title || (section.type === 'featured_products' ? 'Sản phẩm nổi bật' : 'Hàng mới về'))
              break
          }
        }

        // Fallback if no sections configured
        if (!html) {
          html += renderCategories(categories)
          html += renderProducts(productList)
        }

        document.getElementById('app').innerHTML = html
        document.getElementById('footer').innerHTML = `<p>© ${new Date().getFullYear()} ${config.store?.shop_name || 'Shop'}. Powered by KAC company</p>`
      } catch (e) {
        document.getElementById('app').innerHTML = `<div class="loading">Lỗi tải dữ liệu: ${e.message}</div>`
        console.error(e)
      }
    }

    init()
  </script>
</body>
</html>
