[databases]
; Wildcard: forward bất kỳ tên DB nào đến postgres
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; transaction mode: server connection chỉ giữ trong lúc có transaction
; Yêu cầu: PDO::ATTR_EMULATE_PREPARES=true trong Laravel (xem database.php)
pool_mode = transaction

; Tối đa client connections đến pgBouncer (tổng tất cả DB)
max_client_conn = 1000

; Số server connections (đến PostgreSQL) mỗi DB/user pool
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; DISCARD ALL reset mọi session state sau mỗi transaction (bắt buộc cho transaction mode)
server_reset_query = DISCARD ALL
server_reset_query_always = 1

; Bỏ qua các startup params không quan trọng (tránh lỗi kết nối)
ignore_startup_parameters = extra_float_digits,options

; Logging tối thiểu (giảm I/O)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Timeout settings
server_connect_timeout = 10
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 0
