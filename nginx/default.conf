# ═══════════════════════════════════════════════════════════
# Nginx Reverse Proxy — Multi-Tenant Routing
# ═══════════════════════════════════════════════════════════
#
# Priority order (Nginx matches exact > regex specific > regex catch-all):
#   1. localhost         → Backend API (exact)
#   2. master.localhost  → Master Admin (exact)
#   3. *.cms.localhost   → S-Cart CMS (regex, specific)
#   4. *.localhost       → Storefront (regex, catch-all)
#
# Reserved subdomains: master, cms, api, admin, www
# ═══════════════════════════════════════════════════════════

# ──── Upstream definitions ────
upstream backend {
    server backend-adonis:3333;
}

upstream master_ui {
    server frontend-master:5174;
}

upstream storefront_ui {
    server storefront:5173;
}

upstream scart_ui {
    server s-cart:8000;
}

# ──────────────────────────────────────────────────────────
# 1. Backend API — exact host "localhost"
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    # API requests
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-polling/SSE
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Socket.IO WebSocket support
    location /socket.io/ {
        proxy_pass http://backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # File uploads
    location /uploads/ {
        proxy_pass http://backend/uploads/;
        proxy_set_header Host $host;
    }

    # Root fallback (health check)
    location / {
        return 200 '{"status":"ok","service":"nginx-proxy"}';
        add_header Content-Type application/json;
    }
}

# ──────────────────────────────────────────────────────────
# 2. Master Admin Panel — exact match "master.localhost"
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name master.localhost;

    location / {
        proxy_pass http://master_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ──────────────────────────────────────────────────────────
# 3. S-Cart CMS — wildcard *.cms.localhost
#    (checked before *.localhost because regex is more specific)
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name ~^(?<tenant>.+)\.cms\.localhost$;

    # Block reserved subdomains
    if ($tenant ~* "^(master|api|admin|www)$") {
        return 403 '{"error":"Reserved subdomain"}';
    }

    location / {
        proxy_pass http://scart_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass tenant slug to S-Cart
        proxy_set_header X-Tenant $tenant;
    }

    # API calls from CMS → Backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant $tenant;
    }
}

# ──────────────────────────────────────────────────────────
# 4. Storefront — wildcard *.localhost (catch-all)
#    Lowest priority: matches any {tenant}.localhost
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name ~^(?<tenant>.+)\.localhost$;

    # Block reserved subdomains
    if ($tenant ~* "^(master|cms|api|admin|www)$") {
        return 403 '{"error":"Reserved subdomain"}';
    }

    location / {
        proxy_pass http://storefront_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass tenant slug to storefront
        proxy_set_header X-Tenant $tenant;
    }

    # API calls from Storefront → Backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant $tenant;
    }

    # Socket.IO from storefront
    location /socket.io/ {
        proxy_pass http://backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Tenant $tenant;
    }
}
