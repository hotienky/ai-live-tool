# ═══════════════════════════════════════════════════════════
# Nginx Reverse Proxy — Multi-Tenant Routing (SSL)
# ═══════════════════════════════════════════════════════════
#
# Priority order (Nginx matches exact > regex specific > regex catch-all):
#   1. super.vn / localhost              → Backend API (exact)
#   2. master.super.vn / master.localhost → Master Admin (exact)
#   3. *.cms.super.vn / *.cms.localhost  → CMS Admin (regex)
#   4. *.super.vn / *.localhost          → Storefront (regex, catch-all)
#
# Reserved subdomains: master, cms, api, admin, www
# ═══════════════════════════════════════════════════════════

# Docker internal DNS resolver
resolver 127.0.0.11 valid=10s;

# SSL shared settings
ssl_certificate     /etc/nginx/certs/_wildcard.super.vn+2.pem;
ssl_certificate_key /etc/nginx/certs/_wildcard.super.vn+2-key.pem;
ssl_protocols       TLSv1.2 TLSv1.3;

# ──────────────────────────────────────────────────────────
# 1. Backend API — exact host
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl;
    server_name super.vn localhost;

    # API requests
    location /api/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-polling/SSE
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Socket.IO WebSocket support
    location /socket.io/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # File uploads
    location /uploads/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream/uploads/;
        proxy_set_header Host $host;
    }

    # Root fallback (health check)
    location / {
        return 200 '{"status":"ok","service":"nginx-proxy"}';
        add_header Content-Type application/json;
    }
}

# ──────────────────────────────────────────────────────────
# 2. Master Admin Panel
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl;
    server_name master.super.vn master.localhost;

    # API calls → Backend
    location /api/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO → Backend
    location /socket.io/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Everything else → Vite frontend
    location / {
        set $master_upstream frontend-master:5174;
        proxy_pass http://$master_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ──────────────────────────────────────────────────────────
# 3. CMS Admin — wildcard *.cms.super.vn / *.cms.localhost
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl;
    server_name ~^(?<tenant>.+)\.cms\.super\.vn$ ~^(?<tenant>.+)\.cms\.localhost$;

    # Block reserved subdomains
    if ($tenant ~* "^(master|api|admin|www)$") {
        return 403 '{"error":"Reserved subdomain"}';
    }

    # Tenant status check (internal subrequest)
    location = /_tenant_check {
        internal;
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream/api/tenant-status;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Tenant $tenant;
        proxy_set_header Host $host;
    }

    # Suspended tenant page
    error_page 403 = @suspended;
    location @suspended {
        root /etc/nginx/pages;
        try_files /suspended.html =403;
    }

    # API calls → Backend
    location /api/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant $tenant;
    }

    # Everything else → CMS frontend (with tenant check)
    location / {
        auth_request /_tenant_check;

        set $cms_upstream frontend-cms:5175;
        proxy_pass http://$cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant $tenant;
    }

    # Static files (storage) → Backend
    location /storage/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant $tenant;
    }
}

# ──────────────────────────────────────────────────────────
# 4. Storefront — wildcard *.super.vn / *.localhost (catch-all)
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl;
    server_name ~^(?<tenant>.+)\.super\.vn$ ~^(?<tenant>.+)\.localhost$;

    # Block reserved subdomains
    if ($tenant ~* "^(master|cms|api|admin|www)$") {
        return 403 '{"error":"Reserved subdomain"}';
    }

    # Tenant status check (internal subrequest)
    location = /_tenant_check {
        internal;
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream/api/tenant-status;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Tenant $tenant;
        proxy_set_header X-Check-Type storefront;
        proxy_set_header Host $host;
    }

    # Suspended tenant page
    error_page 403 = @suspended;
    location @suspended {
        root /etc/nginx/pages;
        try_files /suspended.html =403;
    }

    location / {
        auth_request /_tenant_check;

        set $store_upstream storefront:5173;
        proxy_pass http://$store_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass tenant slug to storefront
        proxy_set_header X-Tenant $tenant;
    }

    # Static files (storage) → Backend
    location /storage/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant $tenant;
    }

    # API calls from Storefront → Backend
    location /api/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant $tenant;
    }

    # Socket.IO from storefront
    location /socket.io/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Tenant $tenant;
    }
}

# ──────────────────────────────────────────────────────────
# 5. Custom Domain — catch-all for tenant custom domains
# ──────────────────────────────────────────────────────────
# Any domain not matched above (e.g. www.fashionvn.com)
# routes to storefront by default. Backend middleware resolves
# the tenant via the `domains` table lookup.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # Storefront
    location / {
        set $store_upstream storefront:5173;
        proxy_pass http://$store_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API calls → Backend
    location /api/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (storage) → Backend
    location /storage/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO → Backend
    location /socket.io/ {
        set $backend_upstream backend-laravel:3333;
        proxy_pass http://$backend_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
