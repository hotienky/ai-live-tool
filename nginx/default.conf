# ═══════════════════════════════════════════════════════════
# Nginx Reverse Proxy — Multi-Tenant Routing
# ═══════════════════════════════════════════════════════════
#
# Priority order (Nginx matches exact > regex specific > regex catch-all):
#   1. localhost         → Backend API (exact)
#   2. master.localhost  → Master Admin (exact)
#   3. *.localhost       → Storefront (regex, catch-all)
#
# Reserved subdomains: master, cms, api, admin, www
# ═══════════════════════════════════════════════════════════

# Docker internal DNS resolver
resolver 127.0.0.11 valid=10s;

# ──────────────────────────────────────────────────────────
# 1. Backend API — exact host "localhost"
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    # API requests
    location /api/ {
        set $backend_upstream backend-adonis:3333;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-polling/SSE
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Socket.IO WebSocket support
    location /socket.io/ {
        set $backend_upstream backend-adonis:3333;
        proxy_pass http://$backend_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # File uploads
    location /uploads/ {
        set $backend_upstream backend-adonis:3333;
        proxy_pass http://$backend_upstream/uploads/;
        proxy_set_header Host $host;
    }

    # Root fallback (health check)
    location / {
        return 200 '{"status":"ok","service":"nginx-proxy"}';
        add_header Content-Type application/json;
    }
}

# ──────────────────────────────────────────────────────────
# 2. Master Admin Panel — exact match "master.localhost"
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name master.localhost;

    # API calls → Backend
    location /api/ {
        set $backend_upstream backend-adonis:3333;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO → Backend
    location /socket.io/ {
        set $backend_upstream backend-adonis:3333;
        proxy_pass http://$backend_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Everything else → Vite frontend
    location / {
        set $master_upstream frontend-master:5174;
        proxy_pass http://$master_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ──────────────────────────────────────────────────────────
# 3. CMS Admin — wildcard *.cms.localhost
#    (checked before *.localhost because regex is more specific)
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name ~^(?<tenant>.+)\.cms\.localhost$;

    # Block reserved subdomains
    if ($tenant ~* "^(master|api|admin|www)$") {
        return 403 '{"error":"Reserved subdomain"}';
    }

    # API calls → Backend
    location /api/ {
        set $backend_upstream backend-adonis:3333;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant $tenant;
    }

    # Everything else → CMS frontend
    location / {
        set $cms_upstream frontend-cms:5175;
        proxy_pass http://$cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant $tenant;
    }
}

# ──────────────────────────────────────────────────────────
# 4. Storefront — wildcard *.localhost (catch-all)
#    Matches any {tenant}.localhost
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name ~^(?<tenant>.+)\.localhost$;

    # Block reserved subdomains
    if ($tenant ~* "^(master|cms|api|admin|www)$") {
        return 403 '{"error":"Reserved subdomain"}';
    }

    location / {
        set $store_upstream storefront:5173;
        proxy_pass http://$store_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass tenant slug to storefront
        proxy_set_header X-Tenant $tenant;
    }

    # API calls from Storefront → Backend
    location /api/ {
        set $backend_upstream backend-adonis:3333;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant $tenant;
    }

    # Socket.IO from storefront
    location /socket.io/ {
        set $backend_upstream backend-adonis:3333;
        proxy_pass http://$backend_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Tenant $tenant;
    }
}
