<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang web tạm ngưng hoạt động</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 520px;
      padding: 48px 32px;
    }
    .icon {
      width: 80px; height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(245, 158, 11, 0.3);
    }
    .icon svg { width: 40px; height: 40px; color: #fff; }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 8px;
    }
    .code {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      font-size: 13px;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 9v2m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z"/>
      </svg>
    </div>
    <h1>Trang web tạm ngưng hoạt động</h1>
    <p>Website này hiện đang được tạm dừng bởi quản trị viên.</p>
    <p>Vui lòng liên hệ quản trị viên để biết thêm chi tiết.</p>
    <div class="code">HTTP 403 — Suspended</div>
  </div>
</body>
</html>
